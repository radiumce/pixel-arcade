<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>红白机网页模拟器</title>
  <link rel="stylesheet" href="/css/common.css?v=2" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow-x: hidden;
      background:
        radial-gradient(700px 420px at 22% 18%, rgba(46, 204, 113, 0.14), transparent 70%),
        radial-gradient(700px 420px at 78% 18%, rgba(61, 156, 240, 0.16), transparent 70%),
        radial-gradient(900px 500px at 50% 95%, rgba(230, 57, 70, 0.12), transparent 70%),
        #070a10;
    }
    /* Subtle Cyber Perspective Grid Floor */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(61, 156, 240, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(61, 156, 240, 0.05) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0.85) 10%, transparent 75%);
      pointer-events: none;
      z-index: 0;
    }
    .home-wrap {
      position: relative;
      z-index: 1;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }
    .hero-head {
      display: flex;
       flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(230, 57, 70, 0.14);
      border: 1px solid rgba(244, 185, 66, 0.45);
      color: #f6df8b;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      margin-bottom: 10px;
    }
    .hero-title {
      margin: 0;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0.06em;
      background: linear-gradient(180deg, #ffffff 20%, #b8cbe4 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 6px 24px rgba(61, 156, 240, 0.25);
    }

    /* Portrait Collectible Cards Grid */
    .portrait-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(280px, 370px));
      justify-content: center;
      gap: 28px;
    }
    @media (max-width: 680px) {
      .portrait-grid {
        grid-template-columns: minmax(260px, 360px);
      }
    }

    .portrait-card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 490px;
      border-radius: 22px;
      padding: 16px;
      text-decoration: none;
      color: var(--text);
      overflow: hidden;
      background: #101724;
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 20px 44px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      translate: 0px 0px;
      rotate: 0deg;
      scale: 1;
      transition:
        translate 0.35s cubic-bezier(0.22, 1, 0.36, 1),
        scale 0.35s cubic-bezier(0.22, 1, 0.36, 1),
        border-color 0.3s ease,
        box-shadow 0.35s ease;
    }
    .portrait-card--local {
      background:
        radial-gradient(circle at 50% 34%, rgba(46, 204, 113, 0.24), transparent 62%),
        radial-gradient(circle at 20% 80%, rgba(244, 185, 66, 0.14), transparent 55%),
        linear-gradient(180deg, #16242b 0%, #0d151d 65%, #090e15 100%);
      border-color: rgba(46, 204, 113, 0.38);
    }
    .portrait-card--online {
      background:
        radial-gradient(circle at 50% 34%, rgba(61, 156, 240, 0.28), transparent 62%),
        radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.18), transparent 55%),
        linear-gradient(180deg, #152036 0%, #0d1424 65%, #090d18 100%);
      border-color: rgba(61, 156, 240, 0.42);
    }

    /* Holographic Foil Glint Sweep */
    .portrait-card::after {
      content: "";
      position: absolute;
      inset: -40%;
      background: linear-gradient(
        115deg,
        transparent 38%,
        rgba(255, 255, 255, 0.08) 46%,
        rgba(255, 255, 255, 0.18) 50%,
        rgba(255, 255, 255, 0.08) 54%,
        transparent 62%
      );
      translate: -75% 0;
      rotate: 12deg;
      scale: 1;
      transition: translate 0.65s ease;
      pointer-events: none;
    }
    .portrait-card:hover::after,
    .portrait-card:focus-visible::after {
      translate: 75% 0;
    }

    .portrait-card:hover,
    .portrait-card:focus-visible {
      translate: 0px -10px;
      scale: 1.025;
    }
    .portrait-card--local:hover,
    .portrait-card--local:focus-visible {
      border-color: #2ecc71;
      box-shadow:
        0 26px 54px rgba(0, 0, 0, 0.75),
        0 0 32px rgba(46, 204, 113, 0.32),
        inset 0 0 22px rgba(46, 204, 113, 0.12);
    }
    .portrait-card--online:hover,
    .portrait-card--online:focus-visible {
      border-color: #3d9cf0;
      box-shadow:
        0 26px 54px rgba(0, 0, 0, 0.75),
        0 0 32px rgba(61, 156, 240, 0.36),
        inset 0 0 22px rgba(61, 156, 240, 0.14);
    }

    /* Inner Ornamental Frame */
    .card-frame {
      position: absolute;
      inset: 10px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      pointer-events: none;
      z-index: 2;
    }

    /* Card Top Header Bar */
    .card-top {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 6px;
    }
    .card-tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }
    .portrait-card--local .card-tag { color: #6ef5a5; border-color: rgba(46, 204, 113, 0.4); }
    .portrait-card--online .card-tag { color: #7cc4ff; border-color: rgba(61, 156, 240, 0.45); }
    .card-stars {
      font-size: 0.72rem;
      letter-spacing: 2px;
      color: #f4b942;
      text-shadow: 0 0 8px rgba(244, 185, 66, 0.5);
    }

    /* Center Character/Machine Portrait Artwork */
    .card-art {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: -6px 0;
    }
    .card-art svg {
      width: 100%;
      height: 100%;
      max-height: 315px;
      overflow: visible;
      translate: 0px 0px;
      scale: 1;
      transition: translate 0.4s ease, scale 0.4s ease;
    }
    .portrait-card:hover .card-art svg {
      translate: 0px -6px;
      scale: 1.04;
    }

    /* Floating SVG animations */
    .float-slow {
      translate: 0px 0px;
      animation: floatY 3.6s ease-in-out infinite;
    }
    .float-delayed {
      translate: 0px 0px;
      animation: floatY 3.6s ease-in-out -1.8s infinite;
    }
    @keyframes floatY {
      0%, 100% { translate: 0px 0px; }
      50% { translate: 0px -7px; }
    }
    .stream-beam {
      stroke-dasharray: 8 6;
      animation: beamFlow 0.8s linear infinite;
    }
    @keyframes beamFlow {
      to { stroke-dashoffset: -14; }
    }

    /* Bottom Plate */
    .card-bottom {
      position: relative;
      z-index: 3;
      background: linear-gradient(180deg, rgba(14, 21, 33, 0.82), rgba(8, 12, 20, 0.95));
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      backdrop-filter: blur(8px);
    }
    .card-bottom h2 {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #fff;
    }
    .card-cta {
      padding: 8px 15px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .portrait-card--local .card-cta {
      background: linear-gradient(135deg, #2ecc71, #199f53);
      color: #061c0e;
      box-shadow: 0 4px 14px rgba(46, 204, 113, 0.35);
    }
    .portrait-card--online .card-cta {
      background: linear-gradient(135deg, #3d9cf0, #2269c7);
      color: #fff;
      box-shadow: 0 4px 14px rgba(61, 156, 240, 0.38);
    }
  </style>
</head>
<body>
  <main class="home-wrap">
    <header class="hero-head">
      <div class="hero-badge">FAMICOM 8-BIT ARCADE</div>
      <h1 class="hero-title">红白机网页模拟器</h1>
    </header>

    <div class="portrait-grid">
      <!-- Card 1: Local 2P Portrait Card -->
      <a class="portrait-card portrait-card--local" href="/local.html">
        <div class="card-frame"></div>
        <div class="card-top">
          <span class="card-tag">1P · 2P CO-OP</span>
          <span class="card-stars" aria-hidden="true">★★★★★</span>
        </div>

        <div class="card-art" aria-hidden="true">
          <svg viewBox="0 0 320 310">
            <defs>
              <radialGradient id="localAura" cx="50%" cy="48%" r="48%">
                <stop offset="0%" stop-color="#2ecc71" stop-opacity="0.45"/>
                <stop offset="60%" stop-color="#f4b942" stop-opacity="0.12"/>
                <stop offset="100%" stop-color="#000" stop-opacity="0"/>
              </radialGradient>
              <linearGradient id="cabBody" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#28374d"/>
                <stop offset="100%" stop-color="#121a28"/>
              </linearGradient>
              <linearGradient id="fcRed" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#e63946"/>
                <stop offset="100%" stop-color="#9c1426"/>
              </linearGradient>
              <linearGradient id="fcGold" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#fae28c"/>
                <stop offset="50%" stop-color="#d4af37"/>
                <stop offset="100%" stop-color="#9a7416"/>
              </linearGradient>
            </defs>

            <!-- Back Energy Halo & Geometric Hexagon -->
            <circle cx="160" cy="150" r="130" fill="url(#localAura)"/>
            <polygon points="160,22 266,82 266,202 160,262 54,202 54,82" fill="rgba(16, 28, 38, 0.55)" stroke="rgba(46, 204, 113, 0.35)" stroke-width="1.5"/>
            <polygon points="160,34 254,88 254,196 160,250 66,196 66,88" fill="none" stroke="rgba(244, 185, 66, 0.2)" stroke-width="1" stroke-dasharray="4 4"/>

            <!-- Retro Arcade Cabinet & CRT Screen Centerpiece -->
            <g transform="translate(88, 42)">
              <!-- Cabinet Outer Frame -->
              <path d="M16,0 H128 L142,24 V166 H2 V24 Z" fill="url(#cabBody)" stroke="#3e5677" stroke-width="2"/>
              <!-- Top Marquee Sign -->
              <rect x="18" y="6" width="108" height="16" rx="4" fill="url(#fcRed)" stroke="#f4b942" stroke-width="1.2"/>
              <text x="72" y="17" text-anchor="middle" font-size="8.5" font-weight="900" fill="#fff" letter-spacing="0.18em">SUPER ARCADE</text>
              <!-- Glowing CRT Monitor -->
              <rect x="16" y="30" width="112" height="84" rx="10" fill="#07121a" stroke="#2ecc71" stroke-width="2"/>
              <!-- CRT Scanlines & Battle Graphic -->
              <line x1="20" y1="48" x2="124" y2="48" stroke="rgba(46,204,113,0.12)" stroke-width="2"/>
              <line x1="20" y1="68" x2="124" y2="68" stroke="rgba(46,204,113,0.12)" stroke-width="2"/>
              <line x1="20" y1="88" x2="124" y2="88" stroke="rgba(46,204,113,0.12)" stroke-width="2"/>
              <!-- Pixel Lightning Bolt VS in Screen -->
              <polygon points="76,40 62,68 74,68 66,102 88,64 74,64" fill="#f4b942"/>
              <text x="42" y="76" text-anchor="middle" font-size="13" font-weight="900" fill="#ff5c6c">1P</text>
              <text x="102" y="76" text-anchor="middle" font-size="13" font-weight="900" fill="#2ecc71">2P</text>
              <!-- Arcade Control Deck -->
              <polygon points="10,120 134,120 144,142 0,142" fill="#1b2638" stroke="#3e5677" stroke-width="1.5"/>
              <!-- Twin Joysticks on Deck -->
              <line x1="42" y1="134" x2="42" y2="120" stroke="#cbd5e1" stroke-width="3"/>
              <circle cx="42" cy="117" r="5" fill="#e63946"/>
              <line x1="94" y1="134" x2="94" y2="120" stroke="#cbd5e1" stroke-width="3"/>
              <circle cx="94" cy="117" r="5" fill="#2ecc71"/>
            </g>

            <!-- Floating Player I Famicom Controller (Left Foreground) -->
            <g class="float-slow" transform="translate(26, 172) rotate(-14)">
              <rect x="0" y="0" width="124" height="58" rx="10" fill="url(#fcRed)" stroke="#f6df8b" stroke-width="2"/>
              <rect x="6" y="6" width="112" height="46" rx="6" fill="url(#fcGold)"/>
              <rect x="6" y="6" width="32" height="14" rx="3" fill="#9c1426"/>
              <text x="22" y="16" text-anchor="middle" font-size="9" font-weight="900" fill="#f6df8b">I</text>
              <!-- D-Pad -->
              <path d="M26,23 h8 v7 h7 v8 h-7 v7 h-8 v-7 h-7 v-8 h7 z" fill="#181b22" stroke="#fff" stroke-width="0.8"/>
              <!-- Select & Start -->
              <rect x="52" y="38" width="10" height="4" rx="2" fill="#262930"/>
              <rect x="66" y="38" width="10" height="4" rx="2" fill="#262930"/>
              <!-- B & A Buttons -->
              <circle cx="88" cy="36" r="7.5" fill="#d91e36" stroke="#4a0710" stroke-width="1.2"/>
              <circle cx="105" cy="28" r="7.5" fill="#d91e36" stroke="#4a0710" stroke-width="1.2"/>
            </g>

            <!-- Floating Player II Famicom Controller (Right Foreground) -->
            <g class="float-delayed" transform="translate(174, 158) rotate(14)">
              <rect x="0" y="0" width="124" height="58" rx="10" fill="url(#fcRed)" stroke="#2ecc71" stroke-width="2"/>
              <rect x="6" y="6" width="112" height="46" rx="6" fill="url(#fcGold)"/>
              <rect x="6" y="6" width="32" height="14" rx="3" fill="#9c1426"/>
              <text x="22" y="16" text-anchor="middle" font-size="9" font-weight="900" fill="#f6df8b">II</text>
              <!-- D-Pad -->
              <path d="M26,23 h8 v7 h7 v8 h-7 v7 h-8 v-7 h-7 v-8 h7 z" fill="#181b22" stroke="#fff" stroke-width="0.8"/>
              <!-- Select & Start -->
              <rect x="52" y="38" width="10" height="4" rx="2" fill="#262930"/>
              <rect x="66" y="38" width="10" height="4" rx="2" fill="#262930"/>
              <!-- B & A Buttons -->
              <circle cx="88" cy="36" r="7.5" fill="#2ecc71" stroke="#083b1e" stroke-width="1.2"/>
              <circle cx="105" cy="28" r="7.5" fill="#2ecc71" stroke="#083b1e" stroke-width="1.2"/>
            </g>

            <!-- Decorative Pixel Sparks -->
            <rect x="44" y="54" width="6" height="6" fill="#2ecc71" opacity="0.8"/>
            <rect x="268" y="66" width="7" height="7" fill="#f4b942" opacity="0.85"/>
            <rect x="156" y="268" width="8" height="8" fill="#2ecc71" transform="rotate(45 160 272)"/>
          </svg>
        </div>

        <div class="card-bottom">
          <h2>本地双人</h2>
          <span class="card-cta">进入本地模式 →</span>
        </div>
      </a>

      <!-- Card 2: Online Netplay Room Portrait Card -->
      <a class="portrait-card portrait-card--online" href="/online.html">
        <div class="card-frame"></div>
        <div class="card-top">
          <span class="card-tag">60FPS · WEBRTC</span>
          <span class="card-stars" aria-hidden="true">★★★★★</span>
        </div>

        <div class="card-art" aria-hidden="true">
          <svg viewBox="0 0 320 310">
            <defs>
              <radialGradient id="onlineAura" cx="50%" cy="48%" r="48%">
                <stop offset="0%" stop-color="#3d9cf0" stop-opacity="0.5"/>
                <stop offset="60%" stop-color="#a855f7" stop-opacity="0.16"/>
                <stop offset="100%" stop-color="#000" stop-opacity="0"/>
              </radialGradient>
              <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#38bdf8"/>
                <stop offset="50%" stop-color="#2ecc71"/>
                <stop offset="100%" stop-color="#a855f7"/>
              </linearGradient>
              <linearGradient id="cartBlue" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#3d9cf0"/>
                <stop offset="100%" stop-color="#1d4ed8"/>
              </linearGradient>
              <linearGradient id="cartPurple" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#c084fc"/>
                <stop offset="100%" stop-color="#7e22ce"/>
              </linearGradient>
            </defs>

            <!-- Cyber Portal & Orbital Rings -->
            <circle cx="160" cy="150" r="130" fill="url(#onlineAura)"/>
            <circle cx="160" cy="148" r="102" fill="rgba(12, 20, 38, 0.55)" stroke="rgba(61, 156, 240, 0.35)" stroke-width="1.5"/>
            <circle cx="160" cy="148" r="84" fill="none" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1.2" stroke-dasharray="6 5"/>
            <ellipse cx="160" cy="148" rx="118" ry="42" fill="none" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" transform="rotate(-22 160 148)"/>
            <ellipse cx="160" cy="148" rx="118" ry="42" fill="none" stroke="rgba(168, 85, 247, 0.28)" stroke-width="1.5" transform="rotate(22 160 148)"/>

            <!-- Central Holographic Globe Grid -->
            <circle cx="160" cy="148" r="46" fill="#0b1528" stroke="#38bdf8" stroke-width="2"/>
            <ellipse cx="160" cy="148" rx="24" ry="46" fill="none" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2"/>
            <line x1="114" y1="148" x2="206" y2="148" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2"/>
            <line x1="120" y1="128" x2="200" y2="128" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
            <line x1="120" y1="168" x2="200" y2="168" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>

            <!-- High-Speed Pixel Stream Link (P1 <-> P2) -->
            <path class="stream-beam" d="M 78 92 L 242 204" stroke="url(#beamGrad)" stroke-width="4" stroke-linecap="round"/>
            <path class="stream-beam" d="M 88 80 L 252 192" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.65"/>

            <!-- Center Warp Core Badge -->
            <rect x="122" y="135" width="76" height="26" rx="13" fill="#091326" stroke="#2ecc71" stroke-width="1.8"/>
            <text x="160" y="152" text-anchor="middle" font-size="10.5" font-weight="900" fill="#7ef0aa" letter-spacing="0.1em">P1 ⇄ P2</text>

            <!-- Floating P1 Host Cartridge Pod (Top Left) -->
            <g class="float-slow" transform="translate(28, 38) rotate(-8)">
              <rect x="0" y="0" width="96" height="72" rx="9" fill="url(#cartBlue)" stroke="#93c5fd" stroke-width="2"/>
              <rect x="12" y="10" width="72" height="42" rx="4" fill="#f8fafc"/>
              <rect x="12" y="10" width="72" height="11" rx="3" fill="#e63946"/>
              <text x="48" y="18" text-anchor="middle" font-size="6.5" font-weight="900" fill="#fff" letter-spacing="0.1em">HOST STREAM</text>
              <text x="48" y="38" text-anchor="middle" font-size="13" font-weight="900" fill="#0f172a">P1 主机</text>
              <rect x="22" y="58" width="52" height="6" rx="2" fill="#0f172a" opacity="0.45"/>
            </g>

            <!-- Floating P2 Guest Cartridge Receiver Pod (Bottom Right) -->
            <g class="float-delayed" transform="translate(194, 184) rotate(8)">
              <rect x="0" y="0" width="96" height="72" rx="9" fill="url(#cartPurple)" stroke="#e9d5ff" stroke-width="2"/>
              <rect x="12" y="10" width="72" height="42" rx="4" fill="#f8fafc"/>
              <rect x="12" y="10" width="72" height="11" rx="3" fill="#2ecc71"/>
              <text x="48" y="18" text-anchor="middle" font-size="6.5" font-weight="900" fill="#052e16" letter-spacing="0.1em">ZERO-DL PLAY</text>
              <text x="48" y="38" text-anchor="middle" font-size="13" font-weight="900" fill="#0f172a">P2 访客</text>
              <rect x="22" y="58" width="52" height="6" rx="2" fill="#0f172a" opacity="0.45"/>
            </g>

            <!-- Floating Pixel Data Cubes -->
            <rect x="234" y="64" width="10" height="10" rx="2" fill="#38bdf8" transform="rotate(18 239 69)"/>
            <rect x="252" y="84" width="6" height="6" rx="1" fill="#2ecc71"/>
            <rect x="62" y="210" width="10" height="10" rx="2" fill="#c084fc" transform="rotate(-20 67 215)"/>
            <rect x="82" y="232" width="6" height="6" rx="1" fill="#38bdf8"/>
          </svg>
        </div>

        <div class="card-bottom">
          <h2>联机房间</h2>
          <span class="card-cta">进入联机房间 →</span>
        </div>
      </a>
    </div>
  </main>
</body>
</html>
